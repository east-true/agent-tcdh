name: ci

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:
  workflow_call:
    inputs:
      ref:
        type: string
        required: true

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  node:
    name: node and package (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, macos-15-intel, windows-2025]
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # Verified v7 commit
        with:
          persist-credentials: false
          ref: ${{ inputs.ref || github.sha }}
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # Verified v7 commit
        with:
          node-version: '24'
          cache: npm
      - name: Record native runtime
        run: node -p "JSON.stringify({platform:process.platform,arch:process.arch,node:process.version})"
      - name: Install locked dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Typecheck, build, and protocol regression tests
        run: npm run check
      - name: Verify isolated package installation and restart
        run: npm run test:package

  container:
    name: container
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # Verified v7 commit
        with:
          persist-credentials: false
          ref: ${{ inputs.ref || github.sha }}
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # Verified v7 commit
        with:
          node-version: '24'
          cache: npm
      - name: Install verification clients
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Build container image
        run: docker build --tag agent-tcdh:ci .
      - name: Verify non-root runtime, health, protocols, and persistence
        run: npm run test:container -- --image agent-tcdh:ci
